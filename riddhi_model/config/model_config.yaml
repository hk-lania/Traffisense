# TraffiSense YOLO Model Configuration

model_path: "models/best.pt"  # Path to the final trained model
base_model: "yolov8n.pt"      # Initial model for training

# Data configuration
data_yaml: "dataset/data.yaml"

# Training configuration
epochs: 20
imgsz: 640
batch: 16
workers: 4
device: "" # Leave empty to auto-detect (CUDA if available, else CPU)
project_name: "traffisense_yolo"

# Inference configuration
confidence_threshold: 0.40
iou_threshold: 0.45
